[project]
name = "hw2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cristian Bautista", email = "cristiajavierbau30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[project.scripts]
hw2 = "hw2:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
